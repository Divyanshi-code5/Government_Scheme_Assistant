<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
        <title>explaination page</title>
        <style>
            *{
                margin : 0;
                padding: 0;
                box-sizing: border-box;
                font-family: sans-serif;
            }
            .navbar{
                display: flex;
                align-items: center;
                justify-content:flex-start ;
                border-bottom: 1px solid rgb(213, 200, 200);
                margin : 15px ;
                padding-bottom: 15px;
                gap : 50px;
            }
            .logo{
                height: 30px;
                width: max-content;
                padding: 5px;
                border : 1px solid rgb(213, 200, 200) ;
                border-radius: 9px;
                text-align: center;
                background-color: #fff;
                font-size: 20px;
                font-weight: 400;
                 display: flex;
                flex-direction: row;
                gap : 20px;
                height : max-content;
            }
        #app{
                font-size: 20px;
                color: rgb(1, 73, 1);
                font-weight: bolder;
            }
        .userid{
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap : 2px;
            }
            .userlogo{
                height : 40px;
                width : 40px;
                background-color: rgb(1, 73, 1);
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                font-weight: 600;
                border-radius: 50%;
            }
            #menuitem{
                font-size: 20px;
                width: max-content;
                border-radius: 12px;
                padding: 10px;
                border: 2px solid rgb(108, 111, 114);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #username {
                font-size: 18px;
                font-weight: 600;
                color: rgb(1, 73, 1);
            }
            #userstate{
                font-size: 15px;
                color: rgb(121, 126, 131);
                font-weight: 500;
            }
            .mainitem i{
            background-color: rgb(1, 73, 1);
        }
        .mainitem{
                display: flex;
                flex-direction: row;
                gap: 20px;
                color: #fff;
                font-size: 19px;
                margin: 20px 0 20px 5px;
                background-color: rgb(1, 73, 1);
                padding: 10px;
            }
            .mainitem:hover{
                background-color: rgb(128, 48, 2);
                border-radius: 12px;
                color: #fff;
            }
        p{
                margin: 0;
                padding: 0;
            }
            .container{
                display: flex;
                width: 100%;
                flex-direction: row;
                height : max-content;
                overflow-x: hidden;
            }
            .slidebar{
                background-color: rgb(1, 73, 1);
                width: 20%;
                margin-left: -20%;
                padding: 30px;
                transition : margin-left 0.3s ease ;
            }
            .mainbox{
                width: 100%;
                padding:10px;
                transition: width 0.3s ease;
                display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            }
            .container.slide .slidebar{
               margin-left: 0;
            }
            .container.slide .mainbox{
                width: 80%;
            }
            .mainhead{
                display: flex;
                flex-direction: row;
                gap : 10px;
                margin-bottom: 50px;
                background-color: rgb(1, 73, 1);
            }
            .mainlogo{
                height: 40px;
                width : 40px;
                background-color: rgb(178, 151, 1);
                border-radius: 12px;
                color : #000;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .mainlogo i{
                background-color: rgb(178, 151, 1);
            }
            .mainline{
                display: flex;
                flex-direction: column;
                background-color: rgb(1, 73, 1);
                gap: 5px;
            }
            #slidehead{
                font-size: 19px;
                color: #fff;
                font-weight: 600;
                text-transform: capitalize;
                background-color: rgb(1, 73, 1);
            }
            #slideline{
                font-size: 12px;
                font-weight: bold;
                color: #8a97a3;
                text-transform: uppercase;
                background-color: rgb(1, 73, 1);
            }
            @media (max-width : 728px){
            .slidebar{
                    width : 40%;
                    margin-left: -40%;
                    padding: 15px;
                }
                .mainitem {
                    font-size: 15px;
                }
                .mainbox{
                    width : 100%;
                    padding : 20px;
                }
                .container.slide .slidebar{
                    margin-left: 0;
                }
                .container.slide .mainbox{
                    width: 60%;
                }
                #sendbutton{
                    width: 25%;
                }
            }
            .networkerror{
                display: none;
            font-weight: 500;
            margin-top: 15px;
            color: #b42318;
            background-color: #fef3f2;
            border: 1px solid #fecdca;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
        }

            .mainbox {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            flex-direction: column;
        }
        .error{
            color: rgb(234, 42, 42);
            font-size: 15px;
        }
        input  {
            width:200px;
            height : 30px ;
            border: 4px solid #e5e7eb;
            padding: 5px;
            margin: 5px;
        }
        label{
            font-size: 20px;
            color: #1f2937;
            font-weight: 500;
        }
        #sendbutton{
            margin: 20px 0 50px 0;
            background-color: #2563eb;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            height: 45px;
            width: 8%;
            text-align: center;
            border: none;
            border-radius: 1px;
        }
        #sendbutton:hover{
            background-color: #5989f1;
        }
        .loader{
            display : none;
            width : 30px ;
            height : 30px;
            border-radius: 50%;
            border: 4px solid #ddd;
            border-top: 4px solid blue;
            margin : 5px 0 ;
            animation: spin 1s linear infinite;
        }
        @keyframes spin{
            from{
                transform: rotate(0deg);
            }
            to{
                transform : rotate(360deg) ;
            }
        }
        #airesponse{
            border-radius: 12px;
            background-color: #fff;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
            width: max-content;
            height: max-content;
        }
        .endline{
            bottom : 0;
            height : 50px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f4fc;
            font-size: 15px;
            color: #8a97a3;
            padding: 30px;
        }
        </style>
    </head>
    <body>
        <div class="navbar">
            <i id="menuitem" class="fa-solid fa-sliders"></i>
                    <div id="app">Government Scheme Assistant</div>
                </div>

        <div class="container">
        <div class="slidebar">
                <div class="mainhead">
                    <div class="mainlogo"><i class="fa-regular fa-house"></i></div>
                    <div class="mainline">
                        <p id="slidehead">scheme assistant</p>
                        <p id="slideline">government schemes</p>
                    </div>
                </div>
                <div id="dashboard" class="mainitem">
                    <i class="fa-solid fa-sliders"></i>
                    Dashboard
                </div>
                <div id="searchscheme" class="mainitem">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Search Schemes
                </div>
                <div id="eligiblescheme" class="mainitem">
                    <i class="fa-regular fa-circle-check"></i>
                    Check Eligibility
                </div>
                <div id="aiexplaination" class="mainitem">
                    <i class="fa-solid fa-comment-nodes"></i>
                    AI Scheme Assistant
                </div>
                <div id="updateprofile" class="mainitem">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Update Profile
                </div>
                <div id="logout" class="mainitem">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    logout
                </div>
            </div>
        <div class="mainbox">
            <h3>Ask from AI</h3>
            <label>Name the scheme</label>
            <input id="schemename" type="text" placeholder="Give proper name">
            <label class="error" id="schemenameerror"></label>

            <label>Scheme-based Query</label>
            <input type="text" id="userquestion" placeholder="enter your question">
            <label class="error" id="questionerror"></label>

            <button id="sendbutton">send</button>
            <div id="loader" class="loader"></div>
            <message id="message"></message>
            <div id="airesponse"></div>
            <div class="networkerror"></div>
        </div>
        </div>
        <div class="endline">
            AI explainations are for guidance only - always confirm details on the official scheme page.
        </div>
    </body>
    <script>

        const homebar = document.getElementById("menuitem");
        const container = document.querySelector(".container");
        homebar.addEventListener("click",()=>{
            container.classList.toggle("slide");
        });

        const dashboard = document.querySelector("#dashboard");
    const searchScheme = document.querySelector("#searchscheme");
    const eligibleScheme = document.querySelector("#eligiblescheme") ;
    const aiExplaination = document.querySelector("#aiexplaination") ;
    const updateProfileButton = document.querySelector("#updateprofile");
    const logout = document.querySelector("#logout");
     const networkerror = document.querySelector(".networkerror") ;
        const loader = document.querySelector("#loader");
        const schemeName = document.querySelector("#schemename");
        const userQuestion = document.querySelector("#userquestion");
        const schemeNameError = document.querySelector("#schemenameerror");
        const userQuestionError = document.querySelector("#questionerror");

        const sendButton = document.querySelector("#sendbutton");
        const aiResponse = document.querySelector("#airesponse");
        const message = document.querySelector("#message");

        const accessToken = localStorage.getItem("accessToken");
        console.log(accessToken);

        schemeName.addEventListener("blur",()=>{
            if(schemeName.value.trim() === ""){
                schemeNameError.innerHTML = "scheme name is required" ;
            }
            else if(!schemeName.value.match(/^[A-Za-z ]{1,}$/)){
                schemeNameError.innerHTML = "only alphabets are allowed" ;
            }
            else if(schemeName.value.length > 100){
                schemeNameError.innerHTML = "Invalid scheme name" ;
            }
            else {
                schemeNameError.innerHTML = "" ;
            }
        });
        userQuestion.addEventListener("blur",()=>{
            if(userQuestion.value.trim() === ""){
                userQuestionError.innerHTML = "Please write something to ask";
            }
            else if(userQuestion.value.length > 500){
                userQuestionError.innerHTML = "question is too long";
            }
            else{
                userQuestionError.innerHTML = "";
            }
        });
        function schemeNameValidation(){
            if(schemeName.value.trim() === ""){
                schemeNameError.innerHTML = "scheme name is required" ;
                return false ;
            }
            else if(!schemeName.value.match(/^[A-Za-z ]{1,}$/)){
                schemeNameError.innerHTML = "only alphabets are allowed" ;
                return false ;
            }
            else if(schemeName.value.length > 100){
                schemeNameError.innerHTML = "Invalid scheme name" ;
                return false ;
            }
            else {
                schemeNameError.innerHTML = "" ;
                return true ;
            }
        }
        function userQuestionValidation(){
            if(userQuestion.value.trim() === ""){
                userQuestionError.innerHTML = "Please write something to ask";
                return false ;
            }
            else if(userQuestion.value.length > 500){
                userQuestionError.innerHTML = "question is too long";
                return false ;
            }
            else{
                userQuestionError.innerHTML = "";
                return true ;
            }
        }
        sendButton.addEventListener("click",(e)=>{
            e.preventDefault();
            aiResponse.innerHTML = "";
            if(!schemeNameValidation()){
                console.log("scheme name error");
            }
            if(!userQuestionValidation()){
                console.log("question error");
            }
            else{
                loader.style.display = "block";
                sendButton.disabled = true ;
                fetch("https://government-scheme-assistant.onrender.com/ai",{
                    method : "post",
                    headers : {
                        "Content-Type" : "application/json",
                        authorization : `Bearer ${accessToken}`
                    },
                    body : JSON.stringify({
                        scheme_name : `${schemeName.value}`,
                        question : `${userQuestion.value}`
                    })
                })
                .then(res => res.json())
                .then(data => {
                    networkerror.style.display = "none" ;
                    if(data.field === "schemename"){
                        schemeNameError.innerHTML = data.message ;
                    }
                    if(data.field === "question"){
                        userQuestionError.innerHTML = data.message ;
                    }
                    if(data.field === "response"){
                        aiResponse.innerHTML = data.message ;
                        aiResponse.style.padding = "30px" ;
                    }
                })
                .catch((error)=>{
                    networkerror.style.display = "block" ;
                     networkerror.innerHTML = `⚠️ Unable to connect to the server. Please try again.`;
                    console.log(error); 
                })
                .finally(()=>{
                    loader.style.display = "none" ;
                    sendButton.disabled = false ;
                });
            }
        });

    searchScheme.addEventListener("click",()=>{
        window.location.href = "searchScheme.html" ;
    });
        dashboard.addEventListener("click",()=>{
        window.location.href = "new_dashboard.html";
    });
    aiExplaination.addEventListener("click",()=>{
        window.location.href = "ai_explaination.html";
    });
    eligibleScheme.addEventListener("click",()=>{
        window.location.href = "eligiblescheme.html" ;
    });
    logout.addEventListener("click",()=>{
        localStorage.removeItem("accessToken") ;
        window.location.href = "user_login.html" ;
    });
    updateProfileButton.addEventListener("click",()=>{
        window.location.href = "user_updateProfile.html";
    });

    </script>
</html>
