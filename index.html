<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height : 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            flex-direction: column;
            background-color: #f5f7fa;
        }
        .container{
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height : max-content;
            width : 500px;
            border-radius: 12px;
            flex-direction: column;
            background-color: #ffffff;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
            padding: 20px;
        }
        .box{
            display: flex;
            align-items: flex-start;
            justify-content: center;
            flex-direction: column;
            height : 280px;
            width : 280px;
        }
        input{
            width:90%;
            height : 30px ;
            border: 4px solid #e5e7eb;
            padding: 5px;
            margin: 1px;
        }
        label{
            font-size: 20px;
            color: #1f2937;
            font-weight: 400;
        }
        #submitbutton{
            margin: 20px 0 0 0;
            background-color: #2563eb;
            font-size: 20px;
            color: #fff;
            font-weight: 600;
            height: 40px;
            width: 50%;
            text-align: center;
            border: none;
            border-radius: 1px;
        }
        #submitbutton:hover{
            background-color: #5989f1;
        }
        .error{
            color: #dc2626;
            font-size: 17px;
        }
        #message{
            font-size: 21px;
            color: #16a34a;
            font-weight: 500;
        } 
        #heading{
            font-size: 30px;
            font-weight: 600;
            color : #111;
            margin: 0 0 30px 0;
        }
        #logo{
            position: absolute;
            top: 2px;
            left: 2px;
            color: #16a34a;
            font-size: 15px;
            font-weight: 600;
        }
        @media (max-width : 768px){
            .container{
                width : 300px;
                height : 400px;
            }
        }
        .loader{
            display : none;
            width : 30px ;
            height : 30px;
            border-radius: 50%;
            border: 4px solid #ddd;
            border-top: 4px solid blue;
            margin : 5px 0 ;
            animation: spin 1s linear infinite;
        }
        @keyframes spin{
            from{
                transform: rotate(0deg);
            }
            to{
                transform : rotate(360deg) ;
            }
        }
        .networkerror{
            display: none;
            font-weight: 500;
            margin-top: 15px;
            color: #b42318;
            background-color: #fef3f2;
            border: 1px solid #fecdca;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <message id="logo">Government Scheme Assistant</message>
        <message id="heading">sign up</message>
    <div class="box">
    <label>username</label>
    <input type="text" id="username">
    <label class="error" id="usernameerror"></label>

    <label>email</label>
    <input type="text" id="email">
    <label class="error"  id="emailerror"></label>

    <label>password</label>
    <input type="text" id="password">
    <label class="error"  id="passworderror"></label>

    <label>confirm password</label>
    <input type="text" id="confirmpassword">
    <label class="error"  id="confirmpassworderror"></label>
    </div>
    <button id="submitbutton">submit</button>
    <div class="alreadyaccount">Already have an account ? sign in</div>
    <div id="loader" class="loader"></div>
    <div class="networkerror"></div>
    <message id="message"></message>
    </div>
    
</body>
<script>
    const loader = document.querySelector("#loader");
    const username = document.querySelector("#username") ;
    const email = document.querySelector("#email") ;
    const password = document.querySelector("#password") ;
    const confirmpassword = document.querySelector("#confirmpassword") ;

    const usernameError = document.querySelector("#usernameerror") ;
    const emailError = document.querySelector("#emailerror") ;
    const passwordError = document.querySelector("#passworderror") ;
    const confirmPasswordError = document.querySelector("#confirmpassworderror") ;

    const submitButton = document.querySelector("#submitbutton") ;
    const message = document.querySelector("#message") ;

    const alreadyaccount = document.querySelector(".alreadyaccount") ;
     const networkerror = document.querySelector(".networkerror") ;

    const accessToken = localStorage.getItem("accessToken") ;
    if(accessToken){
        window.location.href = "new_dashboard.html";
    }

    username.addEventListener("blur",()=>{
        if(username.value.trim() === ""){
            usernameError.innerHTML = "username is required";
        }
        else if(!username.value.match(/^[A-Za-z0-9]{5,}$/)){
            usernameError.innerHTML = "require A-Za-z0-9 & atleast 5 letters";
        }
        else{
            usernameError.innerHTML = "";
        }
    });
    email.addEventListener("blur",()=>{
        if(email.value.trim() === ""){
            emailError.innerHTML = "email is required";
        }
        else if(!email.value.match(/^[A-Za-z0-9]+@[a-z]+\.(com|in)$/)){
            emailError.innerHTML = "require proper email format";
        }
        else{
            emailError.innerHTML = "";
        }
    });
    password.addEventListener("blur",()=>{
        if(password.value.trim() === ""){
            passwordError.innerHTML = "password is required";
        }
        else if(!password.value.match(/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*])[A-Za-z0-9!@#$%^&*]{8,}$/)){
            passwordError.innerHTML = "require A-Za-z0-9!@#$%^&* & atleast 8 letters";
        }
        else{
            passwordError.innerHTML = "";
        }
    });
    confirmpassword.addEventListener("blur",()=>{
        if(confirmpassword.value.trim() === ""){
            confirmPasswordError.innerHTML = "confirm password is required";
        }
        else if(confirmpassword.value !== password.value){
            confirmPasswordError.innerHTML = "invalid confirm password";
        }
        else{
            confirmPasswordError.innerHTML = "";
        }
    });

    function usernameValidation(){
        if(username.value.trim() === ""){
            usernameError.innerHTML = "username is required";
            return false ;
        }
        else if(!username.value.match(/^[A-Za-z0-9]{5,}$/)){
            usernameError.innerHTML = "require A-Za-z0-9 & atleast 5 letters";
            return false ;
        }
        else{
            usernameError.innerHTML = "";
            return true ;
        }
    }

    function emailValidation(){
        if(email.value.trim() === ""){
            emailError.innerHTML = "email is required";
            return false ;
        }
        else if(!email.value.match(/^[A-Za-z0-9]+@[a-z]+\.(com|in)$/)){
            emailError.innerHTML = "require proper email format";
            return false ;
        }
        else{
            emailError.innerHTML = "";
            return true ;
        }
    }

    function passwordValidation(){
        if(password.value.trim() === ""){
            passwordError.innerHTML = "password is required";
            return false ;
        }
        else if(!password.value.match(/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*])[A-Za-z0-9!@#$%^&*]{8,}$/)){
            passwordError.innerHTML = "require A-Za-z0-9!@#$%^&* & atleast 8 letters";
            return false ;
        }
        else{
            passwordError.innerHTML = "";
            return true ;
        }
    }

    function confirmpasswordValidation(){
        if(confirmpassword.value.trim() === ""){
            confirmPasswordError.innerHTML = "confirm password is required";
            return false ;
        }
        else if(confirmpassword.value !== password.value){
            confirmPasswordError.innerHTML = "invalid confirm password";
            return false ;
        }
        else{
            confirmPasswordError.innerHTML = "";
            return true ;
        }
    }

    submitButton.addEventListener("click",(e)=>{
        e.preventDefault();
        if(!usernameValidation()){
            console.log("username error");
        }
        if(!emailValidation()){
            console.log("email error");
        }
        if(!passwordValidation()){
            console.log("password error");
        }
        if(!confirmpasswordValidation()){
            console.log("confirm password error");
        }
        else{
            submitButton.disabled = true ; 
            loader.style.display = "block" ;
            fetch("http://localhost:5000/signup",{
                method : "post",
                headers : {
                    "Content-Type" : "application/json"
                },
                body : JSON.stringify({
                    username : `${username.value}`,
                    email : `${email.value}`,
                    password : `${password.value}`
                })
            })
            .then(res => res.json())
            .then(data => {
                networkerror.style.display = "none" ;
                console.log(data);
                if(data.field === "username"){
                    usernameError.innerHTML = data.message ;
                }
                if(data.field === "email"){
                    emailError.innerHTML = data.message ;
                }
                if(data.field === "password"){
                    passwordError.innerHTML = data.message ;
                }
                if(data.field === "success"){
                    message.innerHTML = data.message ;
                }
                if(data.success){
                    window.location.href = "user_login.html";
                }
            })
            .catch((error)=>{
                networkerror.style.display = "block" ;
                 networkerror.innerHTML = `⚠️ Unable to connect to the server. Please try again.`;
                console.log(error) ;
            })
            .finally(()=>{
                console.log("finally executed") ;
                loader.style.display = "none" ;
                submitButton.disabled = false ;
                console.log(submitButton.disabled);
            });
        }
    });

    alreadyaccount.addEventListener("click",()=>{
        window.location.href = "user_login.html";
    });
</script>
</html>
