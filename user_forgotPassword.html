<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forgot Password Page</title>
        <style>
            body{
                margin : 0;
                padding: 0;
                font-family: sans-serif;
                box-sizing: border-box;
            }
            .container{
                display: flex;
                align-items:center;
                justify-content: center;
                flex-direction: column;
                min-height: 100vh;
            }
            .box {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }
            #passwordbox{
                display: none;
                flex-direction: column;
                width: 400px;
            }
            .error{
                color: rgb(212, 5, 5);
                font-size: 18px;
            }
            .unverified{
                font-size: 20px;
                font-weight: 600;
                color: rgb(212, 5, 5);
            }
            .verified{
                font-size: 20px;
                font-weight: 600;
                color: rgb(11, 167, 11);
            }
            .otp-container{
                display: flex;
                align-items: center;
                gap:12px;
            }
            .otp-container input{
                height : 55px;
                width: 55px;
                border : 2px solid #ccc ;
                border-radius: 10px;
                text-align: center;
                font-size: 24px;
                font-weight: bold;
                outline: none;
                transition: 0.3s;
            }
            .otp-container input:hover{
                border-color: #2563eb;
            }
            .otp-container input:focus{
                border-color: #2563eb;
                box-shadow: 0 0 8px rgba(37,99,235,0.3);
            }
            .loader{
            display : none;
            width : 30px ;
            height : 30px;
            border-radius: 50%;
            border: 4px solid #ddd;
            border-top: 4px solid blue;
            margin : 5px 0 ;
            animation: spin 1s linear infinite;
        }
        @keyframes spin{
            from{
                transform: rotate(0deg);
            }
            to{
                transform : rotate(360deg) ;
            }
        }
        #submitbutton , #sendotpbutton , #verifybutton{
            margin: 20px 0;
            background-color: #2563eb;
            font-size: 20px;
            color: #fff;
            font-weight: 600;
            height: 35px;
            width: 25%;
            text-align: center;
            border: none;
            border-radius: 1px;
        }
        input{
            width:50%;
            height : 20px ;
            border: 4px solid #e5e7eb;
            padding: 5px;
            margin: 5px;
        }
        label{
            font-size: 20px;
            color: #1f2937;
            font-weight: 400;
        }
        message{margin: 4px 0;}
        #submitbutton:hover{
            background-color: #5989f1;
        }
        @media(max-width : 728px){
            .otp-container input{
                height: 30px;
                width : 30px;
            }
            #sendotpbutton{
                height: max-content;
                width: max-content;
            }
        }
        .networkerror{
        text-align: center;
                display: none;
            font-weight: 500;
            margin-top: 15px;
            color: #b42318;
            background-color: #fef3f2;
            border: 1px solid #fecdca;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
        }
        </style>
    </head>
    <body>
        <div class="networkerror"></div>
        <div class="container">
            <h3>Forgot Password ? </h3>
        <div class="box">
            <label>Enter email</label>
            <input type="text" id="email">
            <label class="error" id="emailerror"></label>
            <button id="sendotpbutton">send OTP</button>
            <div id="loader1" class="loader"></div>
            <message id="otpmessage"></message> 
            
            <label>Enter OTP </label>
            <div class="otp-container">
                <input type="text" maxlength="1" inputmode="numeric">
                <input type="text" maxlength="1" inputmode="numeric">
                <input type="text" maxlength="1" inputmode="numeric">
                <input type="text" maxlength="1" inputmode="numeric">
                <input type="text" maxlength="1" inputmode="numeric">
                <input type="text" maxlength="1" inputmode="numeric">
            </div>
            <label class="error" id="otperror"></label>
            <button id="verifybutton">verify </button>
            <div id="loader2" class="loader"></div>
            <message id="verifymessage"></message>
 
        </div>
        <div class="newpassword" id="passwordbox">
            <label>New Password</label>
            <input type="text" id="password">
            <label class="error" id="passworderror"></label>

            <label>Confirm Password </label>
            <input type="text" id="confirmpassword">
            <label class="error" id="confirmpassworderror"></label>

            <button id="submitbutton">submit</button>
            <div id="loader3" class="loader"></div>
            <message class="verified" id="submitmessage"></message>
        </div>
        </div>
        
        
    </body>
    <script>
        
        const otpInputs = document.querySelectorAll(".otp-container input");
        otpInputs.forEach((input,index)=>{
            input.addEventListener("input",()=>{
                console.log("run");
                if(input.value.length === 1 && index < otpInputs.length-1){
                    otpInputs[index+1].focus();
                    console.log("forward");
                }
            });
        });
        otpInputs.forEach((input,index)=>{
            input.addEventListener("keydown",(e)=>{
                if(e.key==="Backspace" && input.value === "" && index > 0){
                    otpInputs[index-1].focus();
                }
            });
        });

        const accessToken = localStorage.getItem("accessToken");
        console.log(accessToken);

         const networkerror = document.querySelector(".networkerror") ;

        const email = document.querySelector("#email") ;
        const password = document.querySelector("#password") ;
        const confirmpassword = document.querySelector("#confirmpassword") ;

        const emailError = document.querySelector("#emailerror") ;
        const passwordError = document.querySelector("#passworderror") ;
        const confirmPasswordError = document.querySelector("#confirmpassworderror") ;
        const OTPError = document.querySelector("#otperror") ;
        const OTPmessage = document.querySelector("#otpmessage");
        const verifyMessage = document.querySelector("#verifymessage");
        const submitMessage = document.querySelector("#submitmessage");
        
        const submitButton = document.querySelector("#submitbutton") ;
        const sendOTPButton = document.querySelector("#sendotpbutton") ;
        const verifyButton = document.querySelector("#verifybutton") ;

        const loader1 = document.querySelector("#loader1");
        const loader2 = document.querySelector("#loader2");
        const loader3 = document.querySelector("#loader3");

        const passwordBox = document.querySelector("#passwordbox");
        const box = document.querySelector(".box");
        console.log(passwordBox);

        email.addEventListener("click",()=>{
            if(email.value === ""){
                emailError.innerHTML = "email is required" ;
            }
            else if(!email.value.match(/^[A-Za-z0-9]+@[a-z]+\.(com|in)$/)){
                emailError.innerHTML = "require proper email format" ;
            }
            else{
                emailError.innerHTML = "";
            }
        });

        
        function OTPValidation(){
            let otp = "" ;
            otpInputs.forEach(input =>{
            otp += input.value ;
        });

        if(otp.length === 0){
            OTPError.innerHTML = "Please enter all 6 digits." ;
            return false ;
        }
        else if(!otp.trim().match(/^[0-9]{6}$/)){
            OTPError.innerHTML = "Enter only numbers";
            return false ;
        }
        else {
            OTPError.innerHTML = "";
            return otp ;
        }
        }

        function emailValidation(){
            if(email.value === ""){
                emailError.innerHTML = "email is required" ;
                return false ;
            }
            else if(!email.value.match(/^[A-Za-z0-9]+@[a-z]+\.(com|in)$/)){
                emailError.innerHTML = "require proper email format" ;
                return false ;
            }
            else{
                emailError.innerHTML = "";
                return true ;
            }
        }

        sendOTPButton.addEventListener("click",(e)=>{
            e.preventDefault();
            loader1.style.display = "block" ;
            sendOTPButton.disabled = true ;
            if(!emailValidation()){
                console.log("email error");
            }
            else{
                fetch("http://localhost:5000/OTP/send",{
                    method : "post",
                    headers : {
                        "Content-Type" : "application/json",
                        authorization : `Bearer ${accessToken}`
                    },
                    body : JSON.stringify({
                        email : `${email.value}`
                    })
                })
                .then(res => res.json())
                .then(data => {
                    networkerror.style.display = "none" ;
                    if(data.field === "email"){
                        emailError.innerHTML = data.message ;
                    }
                    if(data.field === "otpsend"){
                        if(data.success === true){
                            OTPmessage.classList.remove("unverified") ;
                            OTPmessage.classList.add("verified") ;
                        }
                        else{
                            OTPmessage.classList.remove("verified") ;
                            OTPmessage.classList.add("unverified") ;
                        }

                        OTPmessage.innerHTML = data.message ;
                    }
                })
                .catch(error=>{
                    networkerror.style.display = "block" ;
                    networkerror.innerHTML = `⚠️ Unable to connect to the server. Please try again.`;
                    console.log(error);
                })
                .finally(()=>{
                    loader1.style.display = "none" ;
                    sendOTPButton.disabled = false ;
                });
        }
        });

        verifyButton.addEventListener("click",(e)=>{
            e.preventDefault() ;
            loader2.style.display = "block" ;
            verifyButton.disabled = true ;
            if(!emailValidation()){
                console.log("email error");
            }
            const otp = OTPValidation();
            if(otp === false){
                console.log("Otp error");
            }
            else{
                fetch("http://localhost:5000/OTP/verify",{
                    method : "post",
                    headers : {
                        "Content-Type" : "application/json",
                        authorization : `Bearer ${accessToken}`
                    },
                    body : JSON.stringify({
                        email : `${email.value}`,
                        otp : `${otp}`
                    })
                })
                .then(res => res.json())
                .then(data => {
                    networkerror.style.display = "none" ;
                    if(data.field === "email"){
                        emailError.innerHTML = data.message ;
                    }
                    if(data.field === "otperror"){
                        OTPError.innerHTML = data.message ;
                    }
                    if(data.field === "otpverifymessage"){
                        if(data.success === true){
                            verifyMessage.classList.remove("unverified");
                            verifyMessage.classList.add("verified");
                        }
                        else {
                            verifyMessage.classList.remove("verified");
                            verifyMessage.classList.add("unverified");
                        }
                        verifyMessage.innerHTML = data.message ;
                    }
                    console.log(data.success);
                    if(data.success === true){
                        console.log("showing") ;
                        box.style.display = "none";
                        passwordBox.style.display = "flex" ;
                    }
                })
                .catch((error)=>{
                    networkerror.style.display = "block" ;
                     networkerror.innerHTML = `⚠️ Unable to connect to the server. Please try again.`;
                    console.log(error);
                })
                .finally(()=>{
                    loader2.style.display = "none" ;
                    verifyButton.disabled = false ;
                });
            }
        });

        password.addEventListener("blur",()=>{
            if(password.value.trim() === ""){
                passwordError.innerHTML = "password is  required";
            }
            else if(!password.value.match(/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*])[A-Za-z0-9!@#$%^&*]{8,15}$/)){
                passwordError.innerHTML = "include A-Za-z0-9!@#$%^&* and atleast 8 characters.";
            }
            else {
                passwordError.innerHTML = "";
            }
        });
        confirmpassword.addEventListener("blur",()=>{
            if(confirmpassword.value.trim() === ""){
                confirmPasswordError.innerHTML = "confirm password is reuired";
            }
            else if(password.value !== confirmpassword.value){
                confirmPasswordError.innerHTML = "invalid password";
            }
            else{
                confirmPasswordError.innerHTML = "";
            }
        });

        function passwordValidation(){
            if(password.value.trim() === ""){
                passwordError.innerHTML = "password is  required";
                return false ;
            }
            else if(!password.value.match(/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*])[A-Za-z0-9!@#$%^&*]{8,15}$/)){
                passwordError.innerHTML = "include A-Za-z0-9!@#$%^&* and atleast 8 characters.";
                return false ;
            }
            else {
                passwordError.innerHTML = "";
                return true ;
            }
        }
        function confirmPasswordValidation(){
            if(confirmpassword.value.trim() === ""){
                confirmPasswordError.innerHTML = "confirm password is reuired";
                return false ;
            }
            else if(password.value !== confirmpassword.value){
                confirmPasswordError.innerHTML = "invalid password";
                return false ;
            }
            else{
                confirmPasswordError.innerHTML = "";
                return true ;
            }
        }

        submitButton.addEventListener("click",(e)=>{
            e.preventDefault();
            loader3.style.display = "block";
            submitButton.disabled = true ;
            if(!passwordValidation()){
                console.log("password error");
            }
            if(!confirmPasswordValidation()){
                console.log("confirm error");
            }
            else{
                fetch("http://localhost:5000/change/password",{
                    method : "post",
                    headers : {
                        "Content-Type" : "application/json",
                        authorization : `Bearer ${accessToken}`
                    },
                    body : JSON.stringify({
                        password : `${password.value}`,
                        email : `${email.value}`
                    })
                })
                .then(res => res.json())
                .then(data => {
                    networkerror.style.display = "none" ;
                    if(data.field === "email"){
                        emailError.innerHTML = data.message ;
                    }
                    if(data.field === "password"){
                        passwordError.innerHTML = data.message ;
                    }
                    if(data.field === "submitmessage"){
                        submitMessage.innerHTML = data.message ;
                    }
                    if(data.success === true){
                        window.location.href = "new_dashboard.html";
                    }
                })
                .catch((error)=>{
                    networkerror.style.display = "block" ;
                     networkerror.innerHTML = `⚠️ Unable to connect to the server. Please try again.`;
                    console.log(error);
                })
                .finally(()=>{
                    loader3.style.display = "none";
                    submitButton.disabled = false ;
                });
            }
        });
    </script>
</html>
